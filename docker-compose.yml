networks:
  n8n_network:
    driver: bridge

volumes:
  n8n_data:
    name: n8n_data
    external: true
  redis_data:
    name: redis_data
    external: true
  qdrant_storage:
    name: qdrant_storage
    external: true
  ollama_storage:
    name: ollama_storage
    external: true


services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    hostname: n8n
    restart: unless-stopped
    ports:
      - 5678:5678
    environment:
      - GENERIC_TIMEZONE=Europe/Paris
      - TZ=Europe/Paris
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE=true
    volumes:
      - n8n_data:/home/node/.n8n
      - "./share:/home/node/.n8n-files"
    networks:
      - n8n_network

  wwebjsapi:
    image: avoylenko/wwebjs-api:latest
    container_name: wwebjsapi
    hostname: wwebjsapi
    restart: always
    ports:
      - 3000:3000
    environment:
      - BASE_WEBHOOK_URL=http://n8n:5678/webhook/a443d811-e13e-4835-abef-f1d94e698e6a/webhook
      - ENABLE_WEBHOOK=TRUE
    volumes:
      - ./wwebjs_sessions:/usr/src/app/sessions
    networks:
      - n8n_network

  redis:
    image: redis:latest
    container_name: redis
    hostname: redis
    restart: always
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    networks:
      - n8n_network

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    hostname: qdrant
    ports:
      - 6333:6333
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - n8n_network

  # Use ollama in CPU mode only
  # See richer config in https://github.com/n8n-io/self-hosted-ai-starter-kit/blob/main/docker-compose.yml
  ollama:
    image: ollama/ollama
    container_name: ollama
    hostname: ollama
    ports:
      - 11434:11434
    volumes:
      - ollama_storage:/root/.ollama
    networks:
      - n8n_network
